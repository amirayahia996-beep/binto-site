<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>صوتك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;800;900&display=swap">
<style>
/* Layout: شاشة واحدة. ضجيج كلمات لينكدإن المكررة يملأها، وضغطة مطوّلة (مثل تسجيل رسالة صوتية) تشق الضجيج وتكشف جملة بصوت مدير. بعد ثلاث: الضجيج يتجمّع ويكتب «صوتك». */
:root{--night:#062B2C;--teal:#0B3D3F;--teal2:#2F6B6E;--gold:#C8A24A;--rose:#CFA2A2;--sand:#F6F2ED;--mute:#7FA3A2;
--f:'Tajawal',system-ui,'Segoe UI',Tahoma,sans-serif;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--night);color:var(--sand);overflow:hidden}
body{font-family:var(--f);direction:rtl;-webkit-user-select:none;user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;pointer-events:none;
 padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));
 padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:15px;color:var(--mute)}
.top b{color:var(--sand);font-size:20px;font-weight:800}
.dots{display:flex;gap:8px}.dots i{width:10px;height:10px;border-radius:99px;background:var(--teal2);display:block;transition:background .4s,transform .4s}
.dots i.on{background:var(--gold);transform:scale(1.3)}
.center{display:grid;place-items:center;text-align:center}
.line{max-width:min(760px,92vw);font-size:clamp(30px,5.6vw,64px);font-weight:900;line-height:1.25;color:var(--gold);text-wrap:balance;
 opacity:0;filter:blur(14px);transform:scale(.96);transition:opacity .9s,filter .9s,transform 1.2s cubic-bezier(.2,.8,.2,1)}
.line.show{opacity:1;filter:blur(0);transform:scale(1)}
.line small{display:block;margin-top:14px;font-size:clamp(15px,1.8vw,18px);font-weight:500;color:var(--mute)}
.hint{display:grid;justify-items:center;gap:12px;font-size:clamp(18px,2.2vw,24px);font-weight:500;color:var(--sand);transition:opacity .5s}
.hint.gone{opacity:0}
.mic{width:74px;height:74px;border-radius:99px;border:2px solid var(--gold);display:grid;place-items:center;position:relative}
.mic::after{content:"";position:absolute;inset:-10px;border-radius:99px;border:2px solid var(--gold);opacity:.5;animation:ping 1.8s infinite}
@keyframes ping{0%{transform:scale(.8);opacity:.6}100%{transform:scale(1.5);opacity:0}}
.bottom{display:flex;justify-content:center;padding-bottom:4vh}
.final{display:grid;justify-items:center;gap:16px;text-align:center;opacity:0;transform:translateY(16px);transition:opacity 1s .4s,transform 1s .4s;pointer-events:none}
.final.show{opacity:1;transform:none;pointer-events:auto}
.final p{margin:0;font-size:clamp(17px,2.2vw,22px);max-width:40ch;color:var(--sand);line-height:1.6}
.final p b{color:var(--gold)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{font-family:inherit;font-size:17px;font-weight:800;border-radius:999px;padding:13px 26px;text-decoration:none;border:2px solid var(--gold);cursor:pointer}
.btn.gold{background:var(--gold);color:var(--night)}.btn.line2{background:transparent;color:var(--sand);border-color:var(--teal2)}
.btn:focus-visible,#hold:focus-visible{outline:3px solid var(--sand);outline-offset:3px}
#hold{position:fixed;inset:0;background:transparent;border:0;cursor:pointer;opacity:0}
.note{font-size:13px;color:var(--mute)}
.vn{box-sizing:border-box;pointer-events:auto;display:flex;align-items:center;gap:12px;width:min(420px,88vw);background:var(--sand);border-radius:28px 28px 6px 28px;padding:10px 14px 10px 18px;cursor:pointer;position:relative;overflow:hidden;touch-action:none;box-shadow:0 0 0 0 rgba(200,162,74,.5);animation:glow 2.4s infinite}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(200,162,74,.45)}70%{box-shadow:0 0 0 16px rgba(200,162,74,0)}100%{box-shadow:0 0 0 0 rgba(200,162,74,0)}}
.vn::before{content:"";position:absolute;inset:0;background:var(--gold);transform:scaleX(var(--p,0));transform-origin:right;transition:transform .1s linear}
.vn>*{position:relative}
.vn-mic{width:50px;height:50px;border-radius:99px;background:var(--gold);display:grid;place-items:center;flex:none;transition:transform .2s}
.vn.rec .vn-mic{transform:scale(1.15);background:var(--night)}.vn.rec .vn-mic svg{stroke:var(--gold)}
.vn-wave{flex:1;display:flex;align-items:center;gap:3px;height:36px;min-width:0}
.vn-wave i{flex:1;max-width:5px;border-radius:3px;background:var(--teal2);display:block;transition:height .12s}
.vn-t{font-variant-numeric:tabular-nums;color:var(--teal);font-size:15px;font-weight:700}
.vn-cap{font-size:16px;color:var(--gold);font-weight:800}
.link{pointer-events:auto;background:none;border:0;font-family:inherit;font-size:15px;color:var(--mute);text-decoration:underline;text-underline-offset:4px;cursor:pointer;padding:6px}
.link:focus-visible,.vn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.final:not(.show) .vn,.final:not(.show) .link{pointer-events:none;visibility:hidden}
@media (prefers-reduced-motion:reduce){.mic::after,.vn{animation:none}}
</style>
</head>
<body>


<canvas id="c" aria-hidden="true"></canvas>
<button id="hold" aria-label="اضغط على المايك للبدء، ثم أي ضغطة تنقلك للخطوة التالية"></button>
<div class="ui">
  <div class="top"><span></span><div class="dots" aria-hidden="true"><i></i><i></i><i></i></div></div>
  <div class="center">
    <div class="hint" id="hint">
      <div class="mic"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#C8A24A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></div>
      <span>هذا لينكدإن اليوم: نفس الكلمات عند الجميع.</span>
      <span style="color:var(--gold);font-weight:800">اضغط على المايك… وتكلّم.</span>
    </div>
    <p class="line" id="line" aria-live="polite"></p>
  </div>
  <div class="bottom">
    <div class="final" id="final">
      <p><b>خلّ اسمك يُسمَع، مو يُقرأ وبس.</b><br><span style="color:var(--mute);font-size:.85em">نكتب بصوتك على لينكدإن. نص ساعة منك كل أسبوع.</span></p>
      <div class="vn" id="vn" role="button" tabindex="0" aria-label="تواصل معانا على الواتساب واطلب خطة لإدارة لينكدإن">
        <span class="vn-mic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#062B2C" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span>
        <span class="vn-wave" id="vnwave" aria-hidden="true"></span>
        <span class="vn-t" id="vnt">٠:٠٠</span>
      </div>
      <span class="vn-cap" id="vncap">تواصل معانا: اضغط واطلب خطتك على الواتساب</span>
      <div class="row">
        <a class="link" href="https://wa.me/966534189330?text=%D8%A7%D9%84%D8%B3%D9%84%D8%A7%D9%85%20%D8%B9%D9%84%D9%8A%D9%83%D9%85%D8%8C%20%D8%A3%D8%A8%D8%BA%D9%89%20%D8%AE%D8%B7%D8%A9%20%D9%84%D8%A5%D8%AF%D8%A7%D8%B1%D8%A9%20%D8%AD%D8%B3%D8%A7%D8%A8%D9%8A%20%D9%81%D9%8A%20%D9%84%D9%8A%D9%86%D9%83%D8%AF%D8%A5%D9%86%20%D9%88%D9%83%D8%AA%D8%A7%D8%A8%D8%A9%20%D8%A7%D9%84%D9%85%D8%AD%D8%AA%D9%88%D9%89%20%D8%A8%D8%B5%D9%88%D8%AA%D9%8A.%20%D9%88%D8%B4%20%D8%A7%D9%84%D8%AE%D8%B7%D9%88%D8%A9%20%D8%A7%D9%84%D8%A3%D9%88%D9%84%D9%89%D8%9F" target="_blank" rel="noopener">أو افتح الواتساب مباشرة</a>
        <button class="link" id="again">جرّب مرة ثانية</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const NOISE=['شغوف','خبرة تتجاوز ١٥ عاماً','يسعدنا الإعلان','شريك نجاح','رؤية طموحة','نفخر بـ','حلول متكاملة','التميز','قائد ملهم','بيئة عمل محفزة','نسعى دائماً','الريادة','قيمة مضافة','تحقيق الأهداف','التحول','بكل فخر','فريق متميز','إنجاز جديد','الالتزام بالجودة','نحو المستقبل','أفضل الخدمات','عملاؤنا الكرام','مسيرة حافلة','تحديات وفرص'];
const LINES=[['عميلك القادم كتب اسمك في البحث قبل الاجتماع.','١ من ٣'],['ولقى آخر منشور لك… قبل سنة.','٢ من ٣'],['خبرتك موجودة. اللي ناقص صوتك.','٣ من ٣']];
let W,H,DPR,P=[],t=0,stage=0,holding=false,holdT=0,hx=0,hy=0,ring=0,revealed=false,form=null,formAt=0;
const fontF="'Tajawal',system-ui,sans-serif";
function size(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
function seed(){P=[];const n=Math.round(Math.min(70,Math.max(34,W*H/16000)));
 for(let i=0;i<n;i++){const w=NOISE[i%NOISE.length];P.push({w,x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25,s:13+Math.random()*14,a:.18+Math.random()*.32,ox:0,oy:0,tx:null,ty:null})}}
size();seed();addEventListener('resize',()=>{size();if(!form)seed()});

/* ===== الضغط المطوّل ===== */
const hold=document.getElementById('hold'),hint=document.getElementById('hint'),line=document.getElementById('line'),dots=[...document.querySelectorAll('.dots i')],fin=document.getElementById('final');
const micEl=document.querySelector('.mic');
function onMic(x,y){const r=micEl.getBoundingClientRect();return x>=r.left-24&&x<=r.right+24&&y>=r.top-24&&y<=r.bottom+24}
function advance(x,y){if(form||busy)return;
 if(stage===0&&!onMic(x,y)){micEl.animate([{transform:'scale(1)'},{transform:'scale(1.25)'},{transform:'scale(1)'}],{duration:500});return}
 if(stage===0){const r=micEl.getBoundingClientRect();x=r.left+r.width/2;y=r.top+r.height/2}
 if(stage>=3){busy=true;hx=x;hy=y;holdT=performance.now();holding=true;setTimeout(()=>{holding=false;busy=false},700);gather();return}
 busy=true;holding=true;holdT=performance.now();hx=x;hy=y;ring=0;hint.classList.add('gone');line.classList.remove('show');
 setTimeout(()=>{const [q,who]=LINES[stage];line.innerHTML=q+'<small>'+who+'</small>';line.classList.add('show');dots[stage].classList.add('on');stage++},350);
 setTimeout(()=>{holding=false;busy=false},900)}
let busy=false;
hold.addEventListener('pointerdown',e=>advance(e.clientX,e.clientY));
addEventListener('keydown',e=>{if((e.code==='Space'||e.key==='Enter')&&!e.repeat&&!e.target.closest('.final')){e.preventDefault();const r=micEl.getBoundingClientRect();advance(stage===0?r.left+r.width/2:W/2,stage===0?r.top+r.height/2:H/2)}});

/* ===== التجمّع: الضجيج يكتب «صوتك» ===== */
function gather(){
 line.classList.remove('show');
 const off=document.createElement('canvas');off.width=W;off.height=H;const o=off.getContext('2d');let fs=Math.min(H*0.3,300);o.font=`900 ${fs}px ${fontF}`;const mw=o.measureText('صوتك').width;if(mw>W*0.8)fs=fs*W*0.8/mw;
 o.fillStyle='#fff';o.textAlign='center';o.textBaseline='middle';o.direction='rtl';o.font=`900 ${fs}px ${fontF}`;o.fillText('صوتك',W/2,H*0.3);
 const data=o.getImageData(0,0,W,H).data,pts=[];const step=Math.max(4,Math.round(fs/34));
 for(let y=0;y<H;y+=step)for(let x=0;x<W;x+=step)if(data[(y*W+x)*4+3]>128)pts.push([x,y]);
 // نحول كل كلمة ضجيج إلى نقاط
 const dotsArr=[];for(let i=0;i<pts.length;i++){const src=P[i%P.length];dotsArr.push({x:src.x+(Math.random()-.5)*60,y:src.y+(Math.random()-.5)*20,tx:pts[i][0],ty:pts[i][1],d:Math.random()*600})}
 form=dotsArr;formAt=performance.now();
 setTimeout(()=>fin.classList.add('show'),1600);
}

/* ===== الرسالة الصوتية: تواصل معانا ===== */
const vn=document.getElementById('vn'),vw=document.getElementById('vnwave'),vt=document.getElementById('vnt'),cap=document.getElementById('vncap');
for(let i=0;i<30;i++){const b=document.createElement('i');b.style.height='6px';vw.appendChild(b)}
let rec=false,rs=0,raf=0;const WA='https://wa.me/966534189330?text=%D8%A7%D9%84%D8%B3%D9%84%D8%A7%D9%85%20%D8%B9%D9%84%D9%8A%D9%83%D9%85%D8%8C%20%D8%A3%D8%A8%D8%BA%D9%89%20%D8%AE%D8%B7%D8%A9%20%D9%84%D8%A5%D8%AF%D8%A7%D8%B1%D8%A9%20%D8%AD%D8%B3%D8%A7%D8%A8%D9%8A%20%D9%81%D9%8A%20%D9%84%D9%8A%D9%86%D9%83%D8%AF%D8%A5%D9%86%20%D9%88%D9%83%D8%AA%D8%A7%D8%A8%D8%A9%20%D8%A7%D9%84%D9%85%D8%AD%D8%AA%D9%88%D9%89%20%D8%A8%D8%B5%D9%88%D8%AA%D9%8A.%20%D9%88%D8%B4%20%D8%A7%D9%84%D8%AE%D8%B7%D9%88%D8%A9%20%D8%A7%D9%84%D8%A3%D9%88%D9%84%D9%89%D8%9F';
const AR=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
function vstart(e){if(e)e.preventDefault();rec=true;rs=performance.now();vn.classList.add('rec');cap.textContent='نسجّل طلبك…';loop()}
function loop(){if(!rec)return;const d=performance.now()-rs,p=Math.min(1,d/1600);vn.style.setProperty('--p',p);
 [...vw.children].forEach((b,i)=>b.style.height=(6+Math.abs(Math.sin(d/110+i*.7))*26*(0.4+p*.6))+'px');
 vt.textContent='٠:٠'+AR(Math.min(9,Math.floor(d/1000)));raf=requestAnimationFrame(loop)}
function vend(){if(!rec)return;rec=false;cancelAnimationFrame(raf);vn.classList.remove('rec');const d=performance.now()-rs;
 if(d>=900){vn.style.setProperty('--p',1);cap.textContent='وصلت. نفتح لك الواتساب…';setTimeout(()=>{location.href=WA},500)}
 else{vn.style.setProperty('--p',0);[...vw.children].forEach(b=>b.style.height='6px');vt.textContent='٠:٠٠';cap.textContent='اضغط مطوّلاً شوي أكثر'}}
function vtap(e){if(e)e.preventDefault();if(rec)return;vstart();setTimeout(()=>{rs=performance.now()-1600;setTimeout(vend2,50)},1400)}
function vend2(){rec=false;cancelAnimationFrame(raf);vn.classList.remove('rec');vn.style.setProperty('--p',1);cap.textContent='وصلت. نفتح لك الواتساب…';setTimeout(()=>{location.href=WA},450)}
vn.addEventListener('click',vtap);vn.addEventListener('keydown',e=>{if(e.key==='Enter'||e.code==='Space'){e.preventDefault();e.stopPropagation();vtap()}});
document.getElementById('again').onclick=()=>{form=null;stage=0;dots.forEach(d=>d.classList.remove('on'));fin.classList.remove('show');hint.classList.remove('gone');seed()};

/* ===== الرسم ===== */
function frame(now){t++;ctx.clearRect(0,0,W,H);
 // توهج خفيف
 const gr=ctx.createRadialGradient(W/2,H*.55,0,W/2,H*.55,Math.max(W,H)*.7);gr.addColorStop(0,'#0B3D3F');gr.addColorStop(1,'#062B2C');ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
 if(form){const k=Math.min(1,(now-formAt)/1800);
  for(const p of form){const e=Math.min(1,Math.max(0,(now-formAt-p.d)/1400));const ee=1-Math.pow(1-e,3);
   const x=p.x+(p.tx-p.x)*ee,y=p.y+(p.ty-p.y)*ee;ctx.fillStyle=e>=1?'#C8A24A':`rgba(200,162,74,${.25+.75*ee})`;
   const r=1.4+ee*1.6+(e>=1?Math.sin(now/400+p.tx*.05)*.5:0);ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}
  requestAnimationFrame(frame);return}
 // الموجة الصوتية
 let R=0;if(holding){const d=(now-holdT);R=Math.min(Math.max(W,H)*.48,60+d*.45);ring=R;
  for(let k=0;k<3;k++){const rr=R*(.55+k*.22)+Math.sin(now/120+k)*6;ctx.strokeStyle=`rgba(200,162,74,${.55-k*.15})`;ctx.lineWidth=2;ctx.beginPath();
   for(let a=0;a<=64;a++){const ang=a/64*Math.PI*2;const amp=1+Math.sin(ang*8+now/90)*.04*(1+k)+Math.sin(ang*3-now/160)*.03;const px=hx+Math.cos(ang)*rr*amp,py=hy+Math.sin(ang)*rr*amp;a?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.closePath();ctx.stroke()}
  ctx.fillStyle='#C8A24A';ctx.beginPath();ctx.arc(hx,hy,8+Math.sin(now/90)*2,0,7);ctx.fill()}
 else ring*=.92;
 ctx.textAlign='center';ctx.textBaseline='middle';ctx.direction='rtl';
 for(const p of P){
  if(!reduce){p.x+=p.vx;p.y+=p.vy;if(p.x<-80)p.x=W+80;if(p.x>W+80)p.x=-80;if(p.y<-30)p.y=H+30;if(p.y>H+30)p.y=-30}
  // دفع بالموجة
  const cx=holding?hx:W/2,cy=holding?hy:H/2;const dx=p.x-cx,dy=p.y-cy,dist=Math.hypot(dx,dy)||1;
  let push=0;if(ring>20&&dist<ring+60)push=(ring+60-dist)*.9;
  p.ox+=((dx/dist)*push-p.ox)*.12;p.oy+=((dy/dist)*push-p.oy)*.12;
  const fade=(ring>20?Math.min(1,Math.max(.15,dist/(ring+60))):1)*(line.classList.contains('show')?.3:1);
  ctx.font=`500 ${p.s}px ${fontF}`;ctx.fillStyle=`rgba(159,183,182,${p.a*fade})`;ctx.fillText(p.w,p.x+p.ox,p.y+p.oy)}
 requestAnimationFrame(frame)}
document.fonts&&document.fonts.ready.then(()=>requestAnimationFrame(frame))||requestAnimationFrame(frame);
})();
</script>

</body>
</html>
